[package]
name = "lay"
version = "1.0.23"
edition = "2021"
description = "Typing correction and RU/EN layout switching for Linux desktops"
license-file = "LICENSE"
repository = "https://github.com/radislabus-star/lay-public"
readme = "README.md"
rust-version = "1.75"
keywords = ["keyboard", "gnome", "wayland", "layout", "russian"]
categories = ["command-line-utilities"]

[features]
default = []
direct-llm = ["dep:llama_cpp"]
lexical-compiler = []

[[bin]]
name = "lay"
path = "src/main.rs"

[[bin]]
name = "lay-daemon"
path = "src/bin/lay_daemon.rs"

[[bin]]
name = "lay-test-input"
path = "src/bin/lay_test_input.rs"

[[bin]]
name = "lay-ngram-corpus"
path = "src/bin/lay_ngram_corpus.rs"

[[bin]]
name = "lay-nanda-wave-eval"
path = "src/bin/lay_nanda_wave_eval.rs"

[[bin]]
name = "lay-nanda-dataset"
path = "src/bin/lay_nanda_dataset.rs"

[[bin]]
name = "lay-nanda-wave-train"
path = "src/bin/lay_nanda_wave_train.rs"

[[bin]]
# Cargo target names become Rust crate identifiers and cannot contain a dot.
# The installed CLI and its clap identity are both `lay-l1.1-restore`.
name = "lay-l11-restore"
path = "src/bin/lay_l1_1_restore.rs"

[[bin]]
# Cargo target names become Rust crate identifiers and cannot contain a dot.
# The installed CLI and its clap identity are both `lay-l1.1-serve`.
name = "lay-l11-serve"
path = "src/bin/lay_l1_1_serve.rs"

[[bin]]
name = "lay-morphology-proof"
path = "src/bin/lay_morphology_proof.rs"

[[bin]]
name = "lay-ibus-engine"
path = "src/bin/lay_ibus_engine.rs"

[[bin]]
name = "lay-debug-actions"
path = "src/bin/lay_debug_actions.rs"

[[bin]]
name = "lay-memory-report"
path = "src/bin/lay_memory_report.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
arboard = "3"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
evdev = "0.13"
zbus = "5.15.0"
x11rb = { version = "0.13", features = ["xkb"] }
libc = "0.2"
libm = "=0.2.16"
zstd = "0.13"
rayon = "=1.10.0"
niri-ipc = "26"
llama_cpp = { version = "0.3.2", optional = true }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = false

[profile.metrics]
inherits = "release"
lto = false
codegen-units = 16
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
