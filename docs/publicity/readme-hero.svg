<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
  <title id="title">Lay — мысли быстрее раскладки</title>
  <desc id="desc">Локальный помощник RU/EN для Linux. Схематичный пример: ghbdtn превращается в привет после двух нажатий Shift. Ручной переворот, подсказки Tab и команды терминала.</desc>
