<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Lay — RU / EN layout correction</title>
  <desc id="desc">Illustration, not an application screenshot. Two successive taps of the left Shift turn ghbdtn into привет. Conversion also works from Russian to English.</desc>
  <rect x="1" y="1" width="1118" height="298" rx="24" fill="#F6F8FC" stroke="#DCE3EF" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="44" y="62" font-size="36" font-weight="700" letter-spacing="-2" fill="#17243D">lay</text>
    <path d="M110 37v25" stroke="#DCE3EF" stroke-width="2"/>
    <text x="130" y="56" font-size="18" fill="#54627A">Linux</text>
    <rect x="930" y="30" width="146" height="38" rx="19" fill="#FFFFFF" stroke="#D8E0ED"/>
    <text x="1003" y="55" font-size="17" font-weight="700" text-anchor="middle" fill="#17243D">RU ↔ EN</text>

    <rect x="44" y="112" width="294" height="132" rx="18" fill="#FFFFFF" stroke="#D8E0ED" stroke-width="2"/>
    <circle cx="68" cy="135" r="4" fill="#ABB8CC"/>
    <text x="84" y="140" font-size="13" letter-spacing="2" fill="#54627A">EN</text>
    <text x="191" y="204" font-family="DejaVu Sans Mono, monospace" font-size="53" text-anchor="middle" fill="#54627A">ghbdtn</text>

    <path d="M360 178h29m-9-9 9 9-9 9" fill="none" stroke="#ABB8CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(410 119)">
      <rect y="9" width="116" height="110" rx="16" fill="#CCD5E4"/>
      <rect width="116" height="110" rx="16" fill="#FFFFFF" stroke="#D8E0ED" stroke-width="2"/>
      <path d="m22 39 12-14 12 14h-8v15h-8V39z" fill="none" stroke="#17243D" stroke-width="2" stroke-linejoin="round"/>
      <text x="96" y="34" text-anchor="end" font-size="13" fill="#54627A">01</text>
      <text x="21" y="87" font-size="25" font-weight="600" fill="#17243D">Shift</text>
    </g>
    <path d="M540 178h18m-6-6 6 6-6 6" fill="none" stroke="#ABB8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(572 119)">
      <rect y="9" width="116" height="110" rx="16" fill="#1E40AF"/>
      <rect width="116" height="110" rx="16" fill="#2563EB"/>
      <path d="m22 39 12-14 12 14h-8v15h-8V39z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <text x="96" y="34" text-anchor="end" font-size="13" fill="#FFFFFF">02</text>
      <text x="21" y="87" font-size="25" font-weight="600" fill="#FFFFFF">Shift</text>
    </g>

    <path d="M710 178h25m-9-9 9 9-9 9" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="756" y="112" width="320" height="132" rx="18" fill="#E8F0FF"/>
    <circle cx="780" cy="135" r="4" fill="#1D4ED8"/>
    <text x="796" y="140" font-size="13" letter-spacing="2" fill="#1D4ED8">RU</text>
    <text x="916" y="204" font-family="DejaVu Sans Mono, monospace" font-size="53" font-weight="700" text-anchor="middle" fill="#1D4ED8">привет</text>
  </g>
</svg>
