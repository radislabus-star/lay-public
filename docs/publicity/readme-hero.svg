      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CCFF77"/>
      <stop offset="1" stop-color="#A4E869"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="510" rx="24" fill="url(#background)"/>
