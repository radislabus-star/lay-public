name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  public-install:
    name: Public installer regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh

      - name: Public issue regressions
        run: |
          bash scripts/test-public-issues.sh
          bash scripts/test-install-release-binaries.sh

  msrv:
    name: Rust 1.88.0 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Verify MSRV identity
        run: scripts/verify-rust-toolchain.sh msrv

      - name: Check locked active targets
        env:
          CARGO_TARGET_DIR: target/msrv-1.88.0
          LAY_RUST_TOOLCHAIN: 1.88.0
        run: scripts/cargo-guard.sh check --locked --all-targets

      - name: Check lexical compiler feature
        env:
          CARGO_TARGET_DIR: target/msrv-1.88.0
          LAY_RUST_TOOLCHAIN: 1.88.0
        run: scripts/cargo-guard.sh check --locked --all-targets --features lexical-compiler

  check:
    name: Rust 1.97.1, tray, and extension checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dictionaries
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap hunspell-ru hunspell-en-us wamerican

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Verify lint toolchain identity
        run: scripts/verify-rust-toolchain.sh lint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: architecture guard
        run: bash scripts/check-architecture.sh

      - name: 50-pass architecture audit
        run: bash scripts/check-lay-audit-50.sh

      - name: Fetch locked Rust dependencies
        run: scripts/check-lay-tests.sh fetch

      - name: Hermetic Rust correctness and package lanes
        run: scripts/check-lay-tests.sh all

      - name: Rust lint contract
        run: scripts/check-lay-lints.sh

      - name: GNOME extension syntax
        run: |
          python3 -m json.tool extension/lay@radislabus-star.github.io/metadata.json >/dev/null
          for js in extension/lay@radislabus-star.github.io/*.js; do
            node --check "$js"
          done

      - name: KDE tray and shell scripts syntax
        run: |
          python3 -m py_compile scripts/*.py
          bash -n install.sh update.sh dev-reload.sh scripts/*.sh

      - name: CLI explain smoke
        run: scripts/cargo-guard.sh run --quiet --bin lay -- --no-llm ghbdtn | grep -F 'привет'

      - name: release binaries
        run: scripts/cargo-guard.sh build --release --bins

      - name: ngram cache probe
        run: |
          scripts/cargo-guard.sh run --quiet --bin lay-ngram-corpus -- cache --out target/lay-ci-ngram-ru.json
          scripts/cargo-guard.sh run --quiet --bin lay-ngram-corpus -- check-cache --cache target/lay-ci-ngram-ru.json
