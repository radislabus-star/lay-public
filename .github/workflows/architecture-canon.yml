name: Architecture canon

on:
  pull_request:

permissions:
  contents: read

jobs:
  canon:
    name: Canon links and change records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check canon and declared rule changes
        env:
          CANON_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_architecture_canon.py --base "$CANON_BASE"
      - name: Check guard refusal cases
        run: python3 -m unittest discover -s tests -p test_architecture_canon.py
